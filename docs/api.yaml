      or not significant (0).
    params:
      - name: obj
        type: dict
        required: true
      - name: adjust_method
        type: str
        default: BH
        vocabulary: adjust_method
      - name: p_value
        type: float
        default: 0.05
      - name: lfc
        type: float
        default: 0
    returns:
      type: ndarray
      description: Integer array with values in {-1, 0, 1}.
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_treat.py
      - test_utilities.py
      - test_edger5_parity.py

