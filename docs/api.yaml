  - name: read_data
    kind: function
    domain: io
    module: edgepython.io
    r_equivalent: null
    description: >-
      Universal reader that auto-detects input type (ndarray, DataFrame,
      count table, 10X directory, AnnData, R .rds object, or quantifier
      output from kallisto, lr-kallisto, Salmon, oarfish or RSEM) and
      returns a DGEList. Quantifier output is read with the catch_*
      readers, by default without dividing the counts.
    params:
      - name: data
        type: [str, list, ndarray, DataFrame, DGEList, AnnData]
        required: true
      - name: source
        type: str
        description: >-
          kallisto, lr_kallisto, salmon, oarfish, rsem, 10x, table,
          anndata, rds, sparse, matrix or dataframe; auto-detected if None.
      - name: format
        type: str
        description: For kallisto, 'h5' or 'tsv'.
      - name: path
        type: str
        description: Base path prefix for relative file paths.
      - name: group
        type: list
      - name: labels
        type: list
      - name: columns
        type: tuple
        description: 'For table format: (gene_id_col, count_col) as 0-based indices.'
      - name: sep
        type: str
        default: "\t"
        description: Field separator for table/CSV files.
      - name: obs_col
        type: str
        description: 'For AnnData: column in .obs to use as group factor.'
      - name: layer
        type: str
        description: 'For AnnData: layer name to use instead of .X.'
      - name: ngibbs
        type: int
        default: 100
      - name: divide
        type: bool
        description: Divide quantifier counts by the overdispersions.
        default: false
      - name: verbose
        type: bool
        default: true
        description: Print progress messages.
    returns:
      type: DGEList
    impl_status: complete
    test_status: tested_both
    test_files:
