# =====================================================================
# API entries
# =====================================================================

api:

  # -----------------------------------------------------------------
  # Classes
  # -----------------------------------------------------------------

  - name: DGEList
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: DGEList
    description: >-
      Digital Gene Expression data list. Stores counts, sample info,
      gene annotation, normalization factors, and dispersion estimates.
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_classes.py
      - test_dgelist.py
      - test_edger5_parity.py
      - test_edger_ql_parity.py
      - test_r_vs_py.py
      - test_splicing.py
    citations:
      - robinson2010edger

  - name: DGEExact
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: DGEExact
    description: >-
      Results of an exact test for differential expression between two groups.
    impl_status: complete
    test_status: tested
    test_files:
      - test_classes.py
      - test_exact_test.py
    citations:
      - robinson2008

  - name: DGEGLM
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: DGEGLM
    description: >-
      Fitted generalized linear model object for DGE data.
    impl_status: complete
    test_status: tested
    test_files:
      - test_classes.py
      - test_glm.py
    citations:
      - mccarthy2012

  - name: DGELRT
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: DGELRT
    description: >-
      Likelihood ratio test results for DGE generalized linear models.
    impl_status: complete
    test_status: tested
    test_files:
      - test_classes.py
      - test_glm.py
    citations:
      - mccarthy2012

  - name: TopTags
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: TopTags
    description: >-
      Top differentially expressed genes with adjusted p-values.
    impl_status: complete
    test_status: tested
    test_files:
      - test_classes.py
      - test_glm.py
      - test_treat.py
    citations:
      - robinson2010edger

  - name: PCList
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: PCList
    description: >-
      Paired counts, such as methylated and unmethylated reads, for the
      same features and samples: counts and counts2 matrices with samples
      and genes annotation. Subsetting with [i, j] keeps the pairs aligned.
    impl_status: complete
    test_status: tested_r_comparison
    test_files:
      - test_edger5_parity.py

  - name: DGEBIN
    kind: class
    domain: classes
    module: edgepython.classes
    r_equivalent: DGEBIN
    description: >-
      Binomial GLM fit from bin_fit or bin_ql_fit: as DGEGLM, with counts2
      (failures) beside counts (successes).
    impl_status: complete
    test_status: tested_r_comparison
    test_files:
      - test_edger5_parity.py

  - name: CompressedMatrix
    kind: class
    domain: classes
    module: edgepython.compressed_matrix
    r_equivalent: makeCompressedMatrix
    description: >-
      Memory-efficient matrix storing repeated rows or columns compactly.
      Supports scalar, row-vector, column-vector, and full-matrix storage.
    impl_status: complete
    test_status: tested
    test_files:
      - test_classes.py

  - name: cbind_dgelist
    kind: function
    domain: classes
    module: edgepython.classes
    r_equivalent: cbind.DGEList
    description: >-
      Column-bind (combine samples from) multiple DGEList objects.
    params:
      - name: objects
        type: DGEList
        description: One or more DGEList dicts to combine by column
        variadic: true
    returns:
      type: DGEList
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_dgelist.py
      - test_edger5_parity.py

  - name: rbind_dgelist
    kind: function
    domain: classes
    module: edgepython.classes
    r_equivalent: rbind.DGEList
    description: >-
      Row-bind (combine genes from) multiple DGEList objects.
    params:
      - name: objects
        type: DGEList
        description: One or more DGEList dicts to combine by row
        variadic: true
    returns:
      type: DGEList
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_dgelist.py
      - test_edger5_parity.py

  # -----------------------------------------------------------------
  # DGEList construction and accessors
  # -----------------------------------------------------------------

  - name: make_dgelist
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: DGEList
    description: >-
      Construct a DGEList object from a count matrix and optional metadata.
    params:
      - name: counts
        type: ndarray
        description: Integer count matrix (genes x samples)
        required: true
      - name: lib_size
        type: ndarray
        description: Library sizes. If None, computed as column sums.
      - name: norm_factors
        type: ndarray
        description: Normalization factors. Defaults to ones.
      - name: samples
        type: DataFrame
        description: Sample-level metadata DataFrame.
      - name: group
        type: ndarray
        description: Group labels for each sample.
      - name: genes
        type: DataFrame
        description: Gene-level annotation DataFrame.
      - name: remove_zeros
        type: bool
        description: Remove rows with all-zero counts.
        default: false
      - name: annotation_columns
        type: list
        description: Column names to treat as gene annotation.
    returns:
      type: DGEList
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_dgelist.py
      - test_r_vs_py.py
      - test_backward_compat.py
      - test_dispersion.py
      - test_edger5_parity.py
      - test_edger_ql_parity.py
      - test_exact_test.py
      - test_expression.py
      - test_gene_sets.py
      - test_glm.py
      - test_io.py
      - test_splicing.py
      - test_treat.py
      - test_utilities.py
      - test_visualization.py
    citations:
      - robinson2010edger

  - name: valid_dgelist
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: validDGEList
    description: >-
      Check and fill standard components of a DGEList.
    params:
      - name: "y"
        type: DGEList
        required: true
    returns:
      type: DGEList
    impl_status: complete
    test_status: tested
    test_files:
      - test_dgelist.py

  - name: get_counts
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: getCounts
    description: >-
      Extract the count matrix from a DGEList.
    params:
      - name: "y"
        type: DGEList
        required: true
    returns:
      type: ndarray
    impl_status: complete
    test_status: tested
    test_files:
      - test_dgelist.py

  - name: get_dispersion
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: getDispersion
    description: >-
      Get the most complex dispersion values from a DGEList.
      Priority: tagwise > trended > common > None.
    params:
      - name: "y"
        type: DGEList
        required: true
    returns:
      type: ndarray
    impl_status: complete
    test_status: tested
    test_files:
      - test_dgelist.py
      - test_dispersion.py

  - name: get_dispersion_type
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: getDispersion
    description: >-
      Get the type name of the most complex dispersion in a DGEList.
    params:
      - name: "y"
        type: DGEList
        required: true
    returns:
      type: str
    impl_status: complete
    test_status: untested

  - name: get_offset
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: getOffset
    description: >-
      Extract offset matrix from a DGEList. Returns log(lib.size * norm.factors)
      by default.
    params:
      - name: "y"
        type: DGEList
        required: true
    returns:
      type: ndarray
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_dgelist.py
      - test_edger5_parity.py

  - name: get_norm_lib_sizes
    kind: function
    domain: dgelist
    module: edgepython.dgelist
    r_equivalent: getNormLibSizes
    description: >-
      Get effective (normalized) library sizes: lib.size * norm.factors.
    params:
      - name: "y"
        type: DGEList
        required: true
      - name: log
        type: bool
        description: Return log-transformed sizes.
        default: false
    returns:
      type: ndarray
    impl_status: complete
    test_status: tested
    test_files:
      - test_expression.py
      - test_utilities.py

  # -----------------------------------------------------------------
  # Normalization
  # -----------------------------------------------------------------

  - name: norm_lib_sizes
    kind: function
    domain: normalization
    module: edgepython.normalization
    r_equivalent: normLibSizes
    description: >-
      Same function as calc_norm_factors, under edgeR's newer name.
    params:
      - name: counts
        type: [DGEList, ndarray]
      - name: lib_size
        type: ndarray
        description: Library sizes.
      - name: method
        type: str
        default: TMM
      - name: ref_column
        type: int
        description: Reference column for TMM/TMMwsp.
      - name: logratio_trim
        type: float
        default: 0.3
        description: Amount of trim for log-ratios (TMM).
      - name: sum_trim
        type: float
        default: 0.05
        description: Amount of trim for sums (TMM).
      - name: do_weighting
        type: bool
        default: true
        description: Use precision weights in TMM.
      - name: a_cutoff
        type: float
        default: -10000000000.0
        description: Abundance cutoff for TMM.
      - name: p
        type: float
        default: 0.75
        description: Quantile for upper-quartile method.
    returns:
      type: [DGEList, ndarray]
    impl_status: complete
    test_status: tested_r_comparison
    test_files:
      - test_edger5_parity.py

  - name: calc_norm_factors
    kind: function
    domain: normalization
    module: edgepython.normalization
    r_equivalent: calcNormFactors
    description: >-
      Calculate normalization factors to align library sizes.
    params:
      - name: counts
        type: [DGEList, ndarray]
        description: Count matrix or DGEList.
        required: true
      - name: lib_size
        type: ndarray
        description: Library sizes.
      - name: method
        type: str
        description: Normalization method.
        default: TMM
        vocabulary: normalization_method
      - name: ref_column
        type: int
        description: Reference column for TMM.
      - name: logratio_trim
        type: float
        default: 0.3
      - name: sum_trim
        type: float
        default: 0.05
      - name: do_weighting
        type: bool
        default: true
      - name: a_cutoff
        type: float
        default: -1e10
      - name: p
        type: float
        description: Quantile for upperquartile method.
        default: 0.75
    returns:
      type: [DGEList, ndarray]
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_dgelist.py
      - test_r_vs_py.py
      - test_backward_compat.py
      - test_dispersion.py
      - test_edger5_parity.py
      - test_edger_ql_parity.py
      - test_exact_test.py
      - test_expression.py
      - test_gene_sets.py
      - test_glm.py
      - test_splicing.py
      - test_treat.py
