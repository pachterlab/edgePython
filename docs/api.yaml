  # -----------------------------------------------------------------
  # Gene set testing
  # -----------------------------------------------------------------

  - name: camera
    kind: function
    domain: gene_sets
    module: edgepython.gene_sets
    r_equivalent: camera
    description: >-
      Competitive gene set test accounting for inter-gene correlation.
      Uses the correlation-adjusted mean rank statistic.
    params:
      - name: "y"
        type: [DGEList, ndarray]
        required: true
      - name: index
        type: dict
        description: Dict mapping set names to lists of gene indices.
        required: true
      - name: design
        type: ndarray
      - name: contrast
        type: [int, ndarray]
      - name: weights
        type: ndarray
      - name: use_ranks
        type: bool
        default: false
      - name: allow_neg_cor
        type: bool
        default: false
      - name: inter_gene_cor
        type: float
        default: 0.01
      - name: sort
        type: bool
        default: true
      - name: trend_var
        type: bool
        default: false
        description: Use a mean-variance trend when squeezing the variances.
      - name: directional
        type: bool
        default: true
        description: If False, test for any change regardless of direction (implies use_ranks).
    returns:
      type: DataFrame
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_gene_sets.py
      - test_r_vs_py.py
      - test_backward_compat.py
      - test_edger5_parity.py
    citations:
      - chen2016

  - name: fry
    kind: function
    domain: gene_sets
    module: edgepython.gene_sets
    r_equivalent: fry
    description: >-
      Fast approximation to rotation gene set testing using analytical
      p-values rather than random rotations.
    params:
      - name: "y"
        type: [DGEList, ndarray]
        required: true
      - name: index
        type: dict
        required: true
      - name: design
        type: ndarray
      - name: contrast
        type: [int, ndarray]
      - name: sort
        type: str
        default: directional
      - name: geneid
        type: ndarray
        description: Gene IDs used to match character gene sets.
      - name: gene_weights
        type: ndarray
        description: Weights applied to the genes of every unweighted set.
      - name: standardize
        type: str
        default: posterior.sd
      - name: array_weights
        type: ndarray
        description: Array weights, or observation weights (G x n; defaults to y['weights'] for an EList).
      - name: weights
        type: ndarray
      - name: block
        type: ndarray
        description: Blocks of correlated samples; needs correlation.
      - name: correlation
        type: float
        description: Intra-block correlation.
      - name: trend_var
        type: bool
        default: false
        description: Use a mean-variance trend for the prior variance.
      - name: robust
        type: bool
        default: false
        description: Robust empirical Bayes estimation of the prior variance.
      - name: winsor_tail_p
        type: tuple
        default: [0.05, 0.1]
        description: Winsorization tail proportions when robust.
    returns:
      type: DataFrame
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_gene_sets.py
      - test_r_vs_py.py
      - test_backward_compat.py
      - test_edger5_parity.py
    citations:
      - chen2016

  - name: roast
    kind: function
    domain: gene_sets
    module: edgepython.gene_sets
    r_equivalent: roast
    description: >-
      Rotation gene set test for a single gene set using random rotations.
    params:
      - name: "y"
        type: [DGEList, ndarray]
        required: true
      - name: index
        type: [list, dict]
        required: true
      - name: design
        type: ndarray
      - name: contrast
        type: [int, ndarray]
      - name: nrot
        type: int
        default: 999
      - name: set_statistic
        type: str
        default: mean
        description: 'Set statistic: mean (default), floormean or mean50.'
      - name: sort
        type: bool
        default: true
        description: Sort results by p-value.
    returns:
      type: DataFrame
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_gene_sets.py
      - test_r_vs_py.py
    citations:
      - chen2016

  - name: mroast
    kind: function
    domain: gene_sets
    module: edgepython.gene_sets
    r_equivalent: mroast
