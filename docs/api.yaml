  # -----------------------------------------------------------------
  # GLM testing
  # -----------------------------------------------------------------

  - name: glm_lrt
    kind: function
    domain: glm_testing
    module: edgepython.glm_test
    r_equivalent: glmLRT
    description: >-
      Conduct genewise likelihood ratio tests for one or more coefficients
      in the GLM.
    params:
      - name: glmfit
        type: dict
        description: Fitted DGEGLM from glm_fit.
        required: true
      - name: coef
        type: [int, list]
        description: Coefficient index (or indices) to test.
      - name: contrast
        type: ndarray
        description: Contrast vector or matrix for the test.
    returns:
      type: dict
      description: DGELRT-like dict with table (logFC, logCPM, LR, PValue).
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_glm.py
      - test_edger5_parity.py
      - test_exact_test.py
      - test_expression.py
    citations:
      - mccarthy2012

  - name: glm_ql_ftest
    kind: function
    domain: glm_testing
    module: edgepython.glm_test
    r_equivalent: glmQLFTest
    description: >-
      Conduct genewise quasi-likelihood F-tests for one or more GLM
      coefficients, optionally against a fold-change threshold (TREAT or
      UPSHOT, as in edgeR 5.0).
    params:
      - name: glmfit
        type: dict
        description: Fitted DGEGLM from glm_ql_fit.
        required: true
      - name: coef
        type: [int, list]
      - name: contrast
        type: ndarray
      - name: poisson_bound
        type: bool
        default: true
      - name: fc
        type: float
        default: 1.0
        description: Fold-change threshold; ignored if lfc is given.
      - name: lfc
        type: [float, ndarray]
        description: log2 fold-change threshold(s), one per tested coefficient or a single value for all.
      - name: upshot
        type: bool
        default: true
        description: With a threshold, use UPSHOT rather than plain TREAT.
    returns:
      type: dict
      description: DGELRT-like dict with table (logFC, logCPM, F, PValue).
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_glm.py
      - test_backward_compat.py
      - test_dispersion.py
      - test_edger5_parity.py
      - test_edger_ql_parity.py
      - test_utilities.py
      - test_visualization.py
    citations:
      - lun2016

  - name: glm_treat
    kind: function
    domain: glm_testing
    module: edgepython.glm_test
    r_equivalent: glmTreat
    description: >-
      Test whether log-fold-changes exceed a minimum threshold using
      likelihood ratio or quasi-likelihood methods.
    params:
      - name: glmfit
        type: dict
        required: true
      - name: coef
        type: [int, list]
      - name: contrast
        type: ndarray
      - name: lfc
        type: float
        description: Log2-fold-change threshold.
        default: 0.263  # log2(1.2)
      - name: "null"
        type: str
        default: interval
        vocabulary: treat_null
      - name: legacy
        type: bool
        default: false
        description: Use edgeR 4's statistics.
    returns:
      type: dict
    impl_status: complete
    test_status: tested_both
    test_files:
      - test_treat.py
      - test_r_vs_py.py
      - test_edger5_parity.py
    citations:
      - mccarthy2012

